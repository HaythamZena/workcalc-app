<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

/* ---------------------------- Helpers ---------------------------- */

const toMinutes = (t) => {
  if (!t) return 0;
  const [h, m] = t.split(":").map(Number);
  return h * 60 + m;
};

const money = (n) => {
  const v = Number(n) || 0;
  return v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};

const todayStr = () => new Date().toISOString().slice(0, 10);

const dayLabel = (dateStr) => {
  const d = new Date(dateStr + "T00:00:00");
  const days = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
  return days[d.getDay()];
};

const ARABIC_MONTHS = ["يناير", "فبراير", "مارس", "إبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];

const formatDateArabic = (dateStr) => {
  if (!dateStr) return "";
  const d = new Date(dateStr + "T00:00:00");
  return `${d.getDate()} ${ARABIC_MONTHS[d.getMonth()]} يوم ${dayLabel(dateStr)}`;
};

const DEFAULT_SETTINGS = {
  startTime: "08:00",
  endTime: "17:00",
  wednesdayEndTime: "18:00",
  splitTime: "19:00",
  first2Multiplier: 1.35,
  restMultiplier: 1.7,
  lateMultiplier: 2,
  pricePin: "",
};

const formatHM = (decimalHours) => {
  const total = Math.round(decimalHours * 60);
  const h = Math.floor(total / 60);
  const m = total % 60;
  if (h === 0 && m === 0) return "0 ساعة";
  const hourPart = h === 0 ? "" : h === 1 ? "ساعة" : h === 2 ? "ساعتين" : `${h} ساعات`;
  const minPart = m === 0 ? "" : `${m} دقيقة`;
  if (hourPart && minPart) return `${hourPart} و ${minPart}`;
  return hourPart || minPart;
};

function calcDay(date, checkIn, checkOut, settings, price) {
  const dow = date ? new Date(date + "T00:00:00").getDay() : 0; // 3 = الأربعاء
  const endTimeForDay = dow === 3 ? settings.wednesdayEndTime : settings.endTime;

  const startM = toMinutes(settings.startTime);
  const endM = toMinutes(endTimeForDay);
  const splitM = toMinutes(settings.splitTime);
  const inM = toMinutes(checkIn);
  let outM = toMinutes(checkOut);

  // لو الانصراف عدّى نص الليل (رقم دقايقه أصغر من الحضور)، يبقى في اليوم التالي فعليًا
  if (outM < inM) outM += 1440;

  const lateMinutes = Math.max(0, inM - startM);
  const lateDeductionMinutes = lateMinutes * settings.lateMultiplier;
  const lateDeductionValue = (lateDeductionMinutes / 60) * price;

  const earlyMinutes = Math.max(0, endM - outM);
  const earlyDeductionValue = (earlyMinutes / 60) * price;

  // الشريحة الأولى: من نهاية الدوام لحد وقت التقسيم (٧ م افتراضيًا) بمعامل first2Multiplier
  const tier1End = Math.max(endM, Math.min(outM, splitM));
  const tier1Minutes = Math.max(0, tier1End - endM);
  // الشريحة الثانية: بعد وقت التقسيم بمعامل restMultiplier
  const tier2Minutes = Math.max(0, outM - Math.max(endM, splitM));

  const overtimeMinutes = Math.max(0, outM - endM);
  const overtimeHoursTotal = overtimeMinutes / 60;
  const first2Hours = tier1Minutes / 60;
  const restHours = tier2Minutes / 60;
  const first2Value = first2Hours * price * settings.first2Multiplier;
  const restValue = restHours * price * settings.restMultiplier;
  const totalOvertimeValue = first2Value + restValue;

  // الساعات المكافئة بعد ضرب المعاملات (زي: 6 ساعات فعلية = 9 ساعات ونص مكافئة)
  const weightedHours = (first2Hours * settings.first2Multiplier) + (restHours * settings.restMultiplier);

  const net = totalOvertimeValue - lateDeductionValue - earlyDeductionValue;

  return {
    lateMinutes, lateDeductionValue, earlyMinutes, earlyDeductionValue,
    overtimeHoursTotal, first2Hours, restHours, first2Value, restValue,
    totalOvertimeValue, weightedHours, net, endTimeUsed: endTimeForDay,
  };
}

const STORAGE_KEY = "workcalc-state-v1";

const THEMES = {
  dark: {
    bg: "#14161B", surface: "#1E212B", surface2: "#262A36",
    border: "#333849", text: "#F2F0EA", subtext: "#8B90A0",
    gold: "#E8A33D", red: "#E4614F", green: "#4FB477",
  },
  light: {
    bg: "#EFEBE1", surface: "#FBF9F4", surface2: "#FFFFFF",
    border: "#DCD5C4", text: "#211E18", subtext: "#7A7364",
    gold: "#B5761F", red: "#C24632", green: "#2E7D4F",
  },
};

/* ---------------------------- Icons (inline SVG, no deps) ---------------------------- */
const Icon = ({ d, size = 16, color = "currentColor", strokeWidth = 2 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color}
       strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round">
    <path d={d} />
  </svg>
);
const paths = {
  calc: "M4 3h16v18H4zM8 7h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01",
  history: "M3 12a9 9 0 1 0 3-6.7M3 4v5h5",
  archive: "M21 8v13H3V8M1 3h22v5H1zM10 12h4",
  settings: "M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.6 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.6 1z",
  eye: "M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z",
  eyeOff: "M17.9 17.9A9.9 9.9 0 0 1 12 20c-7 0-11-8-11-8a18.4 18.4 0 0 1 4.2-5.2M9.9 4.2A9.4 9.4 0 0 1 12 4c7 0 11 8 11 8a18.6 18.6 0 0 1-2.2 3.2M14.1 14.1a3 3 0 1 1-4.2-4.2M1 1l22 22",
  save: "M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2zM17 21v-8H7v8M7 3v5h8",
  trash: "M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6h16z",
  sun: "M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10z",
  moon: "M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z",
  search: "M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3",
  lock: "M19 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2zM7 11V7a5 5 0 0 1 10 0v4",
  info: "M12 16v-4M12 8h.01M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z",
  chevronDown: "M6 9l6 6 6-6",
  chevronUp: "M18 15l-6-6-6 6",
  check: "M20 6L9 17l-5-5",
  download: "M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3",
  send: "M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z",
  x: "M18 6 6 18M6 6l12 12",
  plus: "M12 5v14M5 12h14",
  minusCircle: "M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z M8 12h8",
  calendar: "M8 2v4M16 2v4M3 10h18M4 6h16a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z",
};

/* ---------------------------- Main App ---------------------------- */

function App() {
  const [theme, setTheme] = useState("dark");
  const [tab, setTab] = useState("home");
  const [settings, setSettings] = useState(DEFAULT_SETTINGS);
  const [price, setPrice] = useState("");
  const [priceVisible, setPriceVisible] = useState(false);
  const [days, setDays] = useState([]);
  const [archive, setArchive] = useState([]);
  const [manualDeductions, setManualDeductions] = useState([]);
  const [loaded, setLoaded] = useState(false);

  const [date, setDate] = useState(todayStr());
  const [checkIn, setCheckIn] = useState("");
  const [checkOut, setCheckOut] = useState("");
  const [result, setResult] = useState(null);
  const [search, setSearch] = useState("");
  const [expandedPeriod, setExpandedPeriod] = useState(null);
  const [toast, setToast] = useState("");
  const [pdfPeriod, setPdfPeriod] = useState(null);
  const [pdfBusy, setPdfBusy] = useState(false);

  const c = THEMES[theme];

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        setTheme(parsed.theme || "dark");
        setSettings({ ...DEFAULT_SETTINGS, ...(parsed.settings || {}) });
        setPrice(parsed.price ?? "");
        setDays(parsed.days || []);
        setArchive(parsed.archive || []);
        setManualDeductions(parsed.manualDeductions || []);
        if (parsed.lastCheckIn) setCheckIn(parsed.lastCheckIn);
        if (parsed.lastCheckOut) setCheckOut(parsed.lastCheckOut);
      }
    } catch (e) {}
    setLoaded(true);

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  }, []);

  useEffect(() => {
    if (!loaded) return;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        theme, settings, price, days, archive, manualDeductions,
        lastCheckIn: checkIn, lastCheckOut: checkOut,
      }));
    } catch (e) {}
  }, [loaded, theme, settings, price, days, archive, manualDeductions, checkIn, checkOut]);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(""), 2200);
    return () => clearTimeout(t);
  }, [toast]);

  const priceNum = Number(price) || 0;

  const handleCalc = () => {
    if (!price) { setToast("اكتب سعر الساعة الأول"); return; }
    setResult(calcDay(date, checkIn, checkOut, settings, priceNum));
  };

  const handleSaveDay = () => {
    if (!result) return;
    const entry = { id: Date.now(), date, checkIn, checkOut, price: priceNum, ...result };
    setDays((d) => [entry, ...d]);
    setResult(null);
    setToast("اتحفظ اليوم في السجل");
  };

  const deleteDay = (id) => setDays((d) => d.filter((x) => x.id !== id));

  const [modal, setModal] = useState(null); // null | {type:'deductDay', dayId} | {type:'deductStandalone'} | {type:'absence'} | {type:'deletePeriod', periodId} | {type:'revealPrice'}
  const [modalMinutes, setModalMinutes] = useState("");
  const [modalLabel, setModalLabel] = useState("");
  const [modalDate, setModalDate] = useState(todayStr());
  const [modalPin, setModalPin] = useState("");

  const openDeductDay = (dayId) => { setModal({ type: "deductDay", dayId }); setModalMinutes(""); };
  const openDeductStandalone = () => { setModal({ type: "deductStandalone" }); setModalMinutes(""); setModalLabel(""); };
  const openAbsence = () => { setModal({ type: "absence" }); setModalDate(todayStr()); setModalLabel(""); };
  const openDeletePeriod = (periodId) => setModal({ type: "deletePeriod", periodId });
  const hidePrice = () => setPriceVisible(false);
  const requestRevealPrice = () => {
    if (!settings.pricePin) { setPriceVisible(true); return; }
    setModal({ type: "revealPrice" });
    setModalPin("");
  };
  const closeModal = () => setModal(null);

  const confirmModal = () => {
    if (!modal) return;

    if (modal.type === "deductDay") {
      const minutes = Number(modalMinutes);
      if (!minutes || minutes <= 0) { setToast("اكتب رقم دقايق صحيح"); return; }
      setDays((list) =>
        list.map((d) => {
          if (d.id !== modal.dayId) return d;
          const value = (minutes / 60) * (d.price || 0);
          const newManualMinutes = (d.manualDeductionMinutes || 0) + minutes;
          const newManualValue = (d.manualDeductionValue || 0) + value;
          const newWeightedHours = Math.max(0, (d.weightedHours || 0) - minutes / 60);
          return {
            ...d,
            manualDeductionMinutes: newManualMinutes,
            manualDeductionValue: newManualValue,
            weightedHours: newWeightedHours,
            net: d.net - value,
          };
        })
      );
      setToast(`اتخصم ${minutes} دقيقة من اليوم (فلوس وساعات)`);
    }

    if (modal.type === "deductStandalone") {
      const minutes = Number(modalMinutes);
      if (!minutes || minutes <= 0) { setToast("اكتب رقم دقايق صحيح"); return; }
      const value = (minutes / 60) * priceNum;
      const entry = { id: Date.now(), label: modalLabel || "خصم يدوي", minutes, value, date: todayStr() };
      setManualDeductions((list) => [entry, ...list]);
      setToast("اتضاف الخصم");
    }

    if (modal.type === "absence") {
      const entry = {
        id: Date.now(), type: "absence", date: modalDate, note: modalLabel || "إجازة بالخصم",
        checkIn: null, checkOut: null, price: priceNum,
        lateMinutes: 0, lateDeductionValue: 0, earlyMinutes: 0, earlyDeductionValue: 0,
        overtimeHoursTotal: 0, first2Hours: 0, restHours: 0, first2Value: 0, restValue: 0,
        totalOvertimeValue: 0, weightedHours: 0,
        manualDeductionMinutes: 0, manualDeductionValue: 0, net: 0,
      };
      setDays((list) => [entry, ...list]);
      setToast("اتسجل يوم الغياب");
    }

    if (modal.type === "deletePeriod") {
      setArchive((list) => list.filter((p) => p.id !== modal.periodId));
      setToast("اتحذفت الفترة نهائيًا");
    }

    if (modal.type === "revealPrice") {
      if (modalPin === settings.pricePin) {
        setPriceVisible(true);
      } else {
        setToast("الـ PIN غلط");
        return;
      }
    }

    closeModal();
  };

  const addStandaloneDeduction = openDeductStandalone;
  const deductFromDay = openDeductDay;

  const deleteStandaloneDeduction = (id) => setManualDeductions((list) => list.filter((x) => x.id !== id));

  const periodTotals = useMemo(() => {
    const base = days.reduce((acc, d) => {
      acc.overtime += d.totalOvertimeValue;
      acc.weightedHours += d.weightedHours || 0;
      acc.deductions += d.lateDeductionValue + d.earlyDeductionValue + (d.manualDeductionValue || 0);
      acc.net += d.net;
      return acc;
    }, { overtime: 0, weightedHours: 0, deductions: 0, net: 0 });
    manualDeductions.forEach((md) => {
      base.deductions += md.value;
      base.net -= md.value;
      base.weightedHours = Math.max(0, base.weightedHours - md.minutes / 60);
    });
    return base;
  }, [days, manualDeductions]);

  const closePeriod = () => {
    if (days.length === 0) { setToast("مفيش أيام محفوظة في الفترة دي"); return; }
    const period = { id: Date.now(), closedAt: todayStr(), days, manualDeductions, totals: periodTotals };
    setArchive((a) => [period, ...a]);
    setDays([]);
    setManualDeductions([]);
    setToast("اتقفلت الفترة ونقلت للأرشيف");
  };

  const exportPeriodPDF = async (period, action) => {
    if (pdfBusy) return;
    setPdfBusy(true);
    setPdfPeriod(period);
    try {
      await new Promise((r) => setTimeout(r, 120));
      const node = document.getElementById("pdf-report-root");
      const canvas = await html2canvas(node, { scale: 2, backgroundColor: "#ffffff" });
      const imgData = canvas.toDataURL("image/png");
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF("p", "pt", "a4");
      const pageWidth = pdf.internal.pageSize.getWidth();
      const imgWidth = pageWidth - 40;
      const imgHeight = (canvas.height * imgWidth) / canvas.width;
      pdf.addImage(imgData, "PNG", 20, 20, imgWidth, imgHeight);
      const blob = pdf.output("blob");
      const fileName = `تقرير-فترة-${period.closedAt}.pdf`;

      if (action === "share" && navigator.canShare && navigator.canShare({ files: [new File([blob], fileName, { type: "application/pdf" })] })) {
        try {
          await navigator.share({ files: [new File([blob], fileName, { type: "application/pdf" })], title: "تقرير فترة العمل" });
        } catch (e) {
          /* المستخدم لغى المشاركة */
        }
      } else {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = fileName;
        a.click();
        URL.revokeObjectURL(url);
        if (action === "share") setToast("اتحمّل الملف — افتح واتساب وأرفقه يدويًا");
      }
    } catch (e) {
      setToast("حصلت مشكلة في تجهيز التقرير");
    } finally {
      setPdfPeriod(null);
      setPdfBusy(false);
    }
  };

  const filteredDays = days.filter((d) => d.date.includes(search) || dayLabel(d.date).includes(search));

  return (
    <div dir="rtl" style={{ background: c.bg, color: c.text, minHeight: "100vh", fontFamily: "inherit" }}>
      <div style={{ maxWidth: 420, margin: "0 auto", paddingTop: "env(safe-area-inset-top)" }}>
        <div style={{ background: c.surface, borderColor: c.border, borderWidth: 1, borderStyle: "solid" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "20px 20px 12px", borderBottom: `1px solid ${c.border}` }}>
            <div>
              <div style={{ fontSize: 11, letterSpacing: 2, color: c.subtext }}>PLUSSHIFT</div>
              <div style={{ fontSize: 18, fontWeight: "bold" }}>حاسبة ساعات العمل</div>
            </div>
            <button onClick={() => setTheme(theme === "dark" ? "light" : "dark")}
              style={{ background: c.surface2, color: c.text, border: "none", padding: 8, borderRadius: 999, cursor: "pointer" }}>
              <Icon d={theme === "dark" ? paths.sun : paths.moon} size={16} />
            </button>
          </div>

          <div style={{ padding: "16px 20px", minHeight: 540, background: c.bg }}>
            {tab === "home" && (
              <HomeTab c={c} settings={settings} date={date} setDate={setDate} checkIn={checkIn} setCheckIn={setCheckIn}
                checkOut={checkOut} setCheckOut={setCheckOut} price={price} setPrice={setPrice}
                priceVisible={priceVisible} onHidePrice={hidePrice} onRequestRevealPrice={requestRevealPrice}
                result={result} onCalc={handleCalc} onSave={handleSaveDay} />
            )}
            {tab === "history" && (
              <HistoryTab c={c} days={filteredDays} totals={periodTotals} search={search} setSearch={setSearch}
                onDelete={deleteDay} onClose={closePeriod} priceVisible={priceVisible}
                manualDeductions={manualDeductions} onDeductDay={deductFromDay}
                onAddStandalone={addStandaloneDeduction} onDeleteStandalone={deleteStandaloneDeduction}
                onAddAbsence={openAbsence} />
            )}
            {tab === "archive" && (
              <ArchiveTab c={c} archive={archive} expandedPeriod={expandedPeriod} setExpandedPeriod={setExpandedPeriod}
                onExport={exportPeriodPDF} pdfBusy={pdfBusy} priceVisible={priceVisible} onDeletePeriod={openDeletePeriod} />
            )}
            {tab === "settings" && (
              <SettingsTab c={c} settings={settings} setSettings={setSettings} />
            )}
          </div>

          <div style={{ display: "flex", background: c.surface2, borderTop: `1px solid ${c.border}` }}>
            <NavBtn c={c} active={tab === "home"} onClick={() => setTab("home")} d={paths.calc} label="الرئيسية" />
            <NavBtn c={c} active={tab === "history"} onClick={() => setTab("history")} d={paths.history} label="السجل" />
            <NavBtn c={c} active={tab === "archive"} onClick={() => setTab("archive")} d={paths.archive} label="الأرشيف" />
            <NavBtn c={c} active={tab === "settings"} onClick={() => setTab("settings")} d={paths.settings} label="الإعدادات" />
          </div>
        </div>

        {toast && (
          <div style={{ background: c.surface2, color: c.text, border: `1px solid ${c.border}`, marginTop: 12, textAlign: "center", fontSize: 14, padding: "8px 0", borderRadius: 8 }}>
            {toast}
          </div>
        )}
      </div>

      {pdfPeriod && <PdfReportTemplate period={pdfPeriod} />}

      {modal && (
        <InputModal
          c={c} modal={modal}
          modalMinutes={modalMinutes} setModalMinutes={setModalMinutes}
          modalLabel={modalLabel} setModalLabel={setModalLabel}
          modalDate={modalDate} setModalDate={setModalDate}
          modalPin={modalPin} setModalPin={setModalPin}
          onConfirm={confirmModal} onCancel={closeModal}
        />
      )}
    </div>
  );
}

function InputModal({ c, modal, modalMinutes, setModalMinutes, modalLabel, setModalLabel, modalDate, setModalDate, modalPin, setModalPin, onConfirm, onCancel }) {
  const titles = {
    deductDay: "خصم دقايق من اليوم ده",
    deductStandalone: "إضافة خصم مستقل",
    absence: "تسجيل يوم غياب / إجازة",
    deletePeriod: "حذف الفترة نهائيًا؟",
    revealPrice: "أدخل الـ PIN",
  };
  return (
    <div
      style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.55)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50, padding: 20 }}
      onClick={onCancel}
    >
      <div
        dir="rtl"
        onClick={(e) => e.stopPropagation()}
        style={{ background: c.surface, border: `1px solid ${c.border}`, borderRadius: 16, padding: 20, width: "100%", maxWidth: 340, color: c.text }}
      >
        <div style={{ fontSize: 15, fontWeight: "bold", marginBottom: 14 }}>{titles[modal.type]}</div>

        {modal.type === "absence" && (
          <>
            <label style={{ display: "flex", flexDirection: "column", gap: 4, marginBottom: 10 }}>
              <span style={{ fontSize: 12, color: c.subtext }}>التاريخ</span>
              <input type="date" value={modalDate} onChange={(e) => setModalDate(e.target.value)} style={inputStyle(c)} />
            </label>
            <label style={{ display: "flex", flexDirection: "column", gap: 4, marginBottom: 4 }}>
              <span style={{ fontSize: 12, color: c.subtext }}>ملاحظة (اختياري)</span>
              <input type="text" value={modalLabel} onChange={(e) => setModalLabel(e.target.value)} placeholder="إجازة بالخصم" style={inputStyle(c)} />
            </label>
          </>
        )}

        {modal.type === "deductStandalone" && (
          <label style={{ display: "flex", flexDirection: "column", gap: 4, marginBottom: 10 }}>
            <span style={{ fontSize: 12, color: c.subtext }}>وصف الخصم (اختياري)</span>
            <input type="text" value={modalLabel} onChange={(e) => setModalLabel(e.target.value)} placeholder="خصم يدوي" style={inputStyle(c)} />
          </label>
        )}

        {modal.type === "revealPrice" && (
          <label style={{ display: "flex", flexDirection: "column", gap: 4, marginBottom: 4 }}>
            <span style={{ fontSize: 12, color: c.subtext }}>PIN إظهار السعر</span>
            <input
              type="password" inputMode="numeric" value={modalPin}
              onChange={(e) => setModalPin(e.target.value)}
              placeholder="••••" style={{ ...inputStyle(c), fontFamily: "monospace", letterSpacing: 4, textAlign: "center" }}
              autoFocus
              onKeyDown={(e) => { if (e.key === "Enter") onConfirm(); }}
            />
          </label>
        )}

        {(modal.type === "deductDay" || modal.type === "deductStandalone") && (
          <label style={{ display: "flex", flexDirection: "column", gap: 4, marginBottom: 4 }}>
            <span style={{ fontSize: 12, color: c.subtext }}>عدد دقايق الخصم</span>
            <input type="number" value={modalMinutes} onChange={(e) => setModalMinutes(e.target.value)} placeholder="مثلاً 15" style={{ ...inputStyle(c), fontFamily: "monospace" }} autoFocus />
          </label>
        )}

        {modal.type === "deletePeriod" && (
          <div style={{ fontSize: 13, color: c.subtext, marginBottom: 4 }}>
            هيتم حذف الفترة دي وكل أيامها نهائيًا ومش هترجع تاني. اتأكد إنك حمّلت أو شاركت التقرير قبل الحذف لو محتاجه.
          </div>
        )}

        <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
          <button onClick={onCancel} style={{ flex: 1, background: c.surface2, color: c.text, border: `1px solid ${c.border}`, padding: "9px 0", borderRadius: 8, fontSize: 13, fontWeight: "bold", cursor: "pointer" }}>
            إلغاء
          </button>
          <button
            onClick={onConfirm}
            style={{
              flex: 1,
              background: modal.type === "deletePeriod" ? c.red : c.gold,
              color: modal.type === "deletePeriod" ? "#fff" : "#14161B",
              border: "none", padding: "9px 0", borderRadius: 8, fontSize: 13, fontWeight: "bold", cursor: "pointer",
            }}
          >
            {modal.type === "deletePeriod" ? "حذف نهائيًا" : "تأكيد"}
          </button>
        </div>
      </div>
    </div>
  );
}

function PdfReportTemplate({ period }) {
  return (
    <div
      id="pdf-report-root"
      dir="rtl"
      style={{
        position: "fixed", top: 0, left: "-99999px",
        width: 760, background: "#ffffff", color: "#14161B",
        fontFamily: "Tahoma, Arial, sans-serif", padding: 32,
      }}
    >
      <div style={{ textAlign: "center", marginBottom: 20 }}>
        <div style={{ fontSize: 22, fontWeight: 900 }}>تقرير فترة عمل — PlusShift</div>
        <div style={{ fontSize: 13, color: "#555", marginTop: 4 }}>تاريخ إقفال الفترة: {formatDateArabic(period.closedAt)}</div>
      </div>

      <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
        <thead>
          <tr style={{ background: "#14161B", color: "#F2F0EA" }}>
            <th style={pdfTh}>التاريخ</th>
            <th style={pdfTh}>الحضور</th>
            <th style={pdfTh}>الانصراف</th>
            <th style={pdfTh}>الأوفر</th>
            <th style={pdfTh}>الخصومات</th>
            <th style={pdfTh}>الصافي</th>
          </tr>
        </thead>
        <tbody>
          {period.days.slice().reverse().map((d, i) =>
            d.type === "absence" ? (
              <tr key={d.id} style={{ background: i % 2 === 0 ? "#FFFFFF" : "#F3F1EA" }}>
                <td style={pdfTd}>{formatDateArabic(d.date)}</td>
                <td style={{ ...pdfTd, color: "#888" }} colSpan={5}>{d.note || "إجازة بالخصم"} — للتذكير فقط</td>
              </tr>
            ) : (
              <tr key={d.id} style={{ background: i % 2 === 0 ? "#FFFFFF" : "#F3F1EA" }}>
                <td style={pdfTd}>{formatDateArabic(d.date)}</td>
                <td style={{ ...pdfTd, fontFamily: "monospace" }}>{d.checkIn}</td>
                <td style={{ ...pdfTd, fontFamily: "monospace" }}>{d.checkOut}</td>
                <td style={{ ...pdfTd, fontFamily: "monospace" }}>{money(d.totalOvertimeValue)}</td>
                <td style={{ ...pdfTd, fontFamily: "monospace", color: "#C24632" }}>{money((d.lateDeductionValue || 0) + (d.earlyDeductionValue || 0) + (d.manualDeductionValue || 0))}</td>
                <td style={{ ...pdfTd, fontFamily: "monospace", fontWeight: "bold" }}>{money(d.net)}</td>
              </tr>
            )
          )}
        </tbody>
        <tfoot>
          <tr style={{ background: "#E8A33D", color: "#14161B", fontWeight: 900 }}>
            <td style={pdfTd} colSpan={3}>الإجمالي ({period.days.length} يوم)</td>
            <td style={pdfTd}>{money(period.totals.overtime)}</td>
            <td style={pdfTd}>{money(period.totals.deductions)}</td>
            <td style={pdfTd}>{money(period.totals.net)}</td>
          </tr>
        </tfoot>
      </table>

      {period.manualDeductions && period.manualDeductions.length > 0 && (
        <div style={{ marginTop: 18 }}>
          <div style={{ fontSize: 14, fontWeight: "bold", marginBottom: 6 }}>خصومات مستقلة</div>
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
            <thead>
              <tr style={{ background: "#F3F1EA" }}>
                <th style={pdfTh}>الوصف</th>
                <th style={pdfTh}>الدقايق</th>
                <th style={pdfTh}>القيمة</th>
              </tr>
            </thead>
            <tbody>
              {period.manualDeductions.map((md) => (
                <tr key={md.id}>
                  <td style={pdfTd}>{md.label}</td>
                  <td style={{ ...pdfTd, fontFamily: "monospace" }}>{md.minutes}</td>
                  <td style={{ ...pdfTd, fontFamily: "monospace", color: "#C24632" }}>-{money(md.value)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      <div style={{ marginTop: 20, fontSize: 11, color: "#888", textAlign: "center" }}>
        تم إنشاء التقرير تلقائيًا بواسطة تطبيق PlusShift
      </div>
    </div>
  );
}

const pdfTh = { border: "1px solid #d8d3c4", padding: "8px 6px", textAlign: "center" };
const pdfTd = { border: "1px solid #d8d3c4", padding: "6px", textAlign: "center" };

function NavBtn({ c, active, onClick, d, label }) {
  return (
    <button onClick={onClick} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4, padding: "12px 0", background: "none", border: "none", cursor: "pointer", color: active ? c.gold : c.subtext }}>
      <Icon d={d} size={18} />
      <span style={{ fontSize: 11 }}>{label}</span>
    </button>
  );
}

function Field({ c, label, children }) {
  return (
    <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
      <span style={{ fontSize: 12, color: c.subtext }}>{label}</span>
      {children}
    </label>
  );
}

const inputStyle = (c) => ({ width: "100%", background: c.surface2, color: c.text, border: `1px solid ${c.border}`, borderRadius: 8, padding: "8px 12px", fontSize: 14 });

function PriceEyeButton({ c, visible, pinSet, onHide, onRequestReveal }) {
  return (
    <button
      onClick={() => (visible ? onHide() : onRequestReveal())}
      style={{ background: c.surface2, color: c.subtext, border: "none", padding: 8, borderRadius: 8, cursor: "pointer" }}
      title={visible ? "إخفاء السعر" : pinSet ? "أدخل الـ PIN عشان تشوف السعر" : "إظهار السعر"}
    >
      <Icon d={visible ? paths.eye : paths.eyeOff} size={16} />
    </button>
  );
}

function HomeTab({ c, settings, date, setDate, checkIn, setCheckIn, checkOut, setCheckOut, price, setPrice, priceVisible, onHidePrice, onRequestRevealPrice, result, onCalc, onSave }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <Field c={c} label="التاريخ">
        <input type="date" value={date} onChange={(e) => setDate(e.target.value)} style={inputStyle(c)} />
        <span style={{ fontSize: 11, color: c.subtext, marginTop: 2 }}>{formatDateArabic(date)}</span>
      </Field>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
        <Field c={c} label="وقت الحضور">
          <input type="time" value={checkIn} onChange={(e) => setCheckIn(e.target.value)} style={{ ...inputStyle(c), fontFamily: "monospace" }} />
        </Field>
        <Field c={c} label="وقت الانصراف">
          <input type="time" value={checkOut} onChange={(e) => setCheckOut(e.target.value)} style={{ ...inputStyle(c), fontFamily: "monospace" }} />
        </Field>
      </div>
      <Field c={c} label="سعر الساعة">
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          <input type={priceVisible ? "number" : "password"} value={price} onChange={(e) => setPrice(e.target.value)}
            placeholder="اكتب سعرك" style={{ ...inputStyle(c), fontFamily: "monospace" }} />
          <PriceEyeButton c={c} visible={priceVisible} pinSet={!!settings.pricePin} onHide={onHidePrice} onRequestReveal={onRequestRevealPrice} />
        </div>
      </Field>
      <button onClick={onCalc} style={{ width: "100%", background: c.gold, color: "#14161B", border: "none", padding: "12px 0", borderRadius: 12, fontWeight: "bold", fontSize: 14, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
        <Icon d={paths.calc} size={16} /> احسب
      </button>
      {result && <TicketResult c={c} settings={settings} result={result} priceVisible={priceVisible} onSave={onSave} />}
    </div>
  );
}

function TicketResult({ c, settings, result, priceVisible, onSave }) {
  const netPositive = result.net >= 0;
  return (
    <div>
      <div style={{ background: c.surface2, border: `1px solid ${c.border}`, borderRadius: 12, overflow: "hidden" }}>
        <div style={{ padding: "12px 16px", borderBottom: `1px dashed ${c.border}` }}>
          <Row c={c} label="ساعات الأوفر الفعلية" value={priceVisible ? formatHM(result.overtimeHoursTotal) : "•••"} />
          <Row c={c} label="الساعات المكافئة (بعد المعامل)" value={priceVisible ? formatHM(result.weightedHours) : "•••"} />
          <Row c={c} label={`قبل الساعة ${settings.splitTime} (×${settings.first2Multiplier})`} value={priceVisible ? money(result.first2Value) : "•••"} />
          <Row c={c} label={`بعد الساعة ${settings.splitTime} (×${settings.restMultiplier})`} value={priceVisible ? money(result.restValue) : "•••"} />
        </div>
        <div style={{ padding: "12px 16px", borderBottom: `1px dashed ${c.border}` }}>
          <Row c={c} label={`تأخير ${result.lateMinutes} دقيقة`} value={"-" + (priceVisible ? money(result.lateDeductionValue) : "•••")} color={c.red} />
          <Row c={c} label={`انصراف مبكر ${result.earlyMinutes} دقيقة`} value={"-" + (priceVisible ? money(result.earlyDeductionValue) : "•••")} color={c.red} />
        </div>
        <div style={{ padding: "16px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <span style={{ fontSize: 14, fontWeight: "bold" }}>الصافي النهائي</span>
          <span style={{ fontSize: 24, fontWeight: 900, fontFamily: "monospace", color: netPositive ? c.gold : c.red }}>
            {priceVisible ? money(result.net) : "•••••"}
          </span>
        </div>
      </div>
      <button onClick={onSave} style={{ width: "100%", marginTop: 8, background: c.surface2, color: c.text, border: `1px solid ${c.border}`, padding: "10px 0", borderRadius: 12, fontSize: 14, fontWeight: "bold", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
        <Icon d={paths.save} size={15} /> حفظ اليوم
      </button>
    </div>
  );
}

function Row({ c, label, value, color }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: color || c.subtext, marginTop: 4 }}>
      <span>{label}</span>
      <span style={{ fontFamily: "monospace" }}>{value}</span>
    </div>
  );
}

function HistoryTab({ c, days, totals, search, setSearch, onDelete, onClose, priceVisible, manualDeductions, onDeductDay, onAddStandalone, onDeleteStandalone, onAddAbsence }) {
  const workDays = days.filter((d) => d.type !== "absence");
  const absenceDays = days.filter((d) => d.type === "absence");
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ background: c.surface2, border: `1px solid ${c.border}`, borderRadius: 12, padding: 16 }}>
        <div style={{ fontSize: 12, color: c.subtext, marginBottom: 8 }}>الفترة الحالية</div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, textAlign: "center" }}>
          <Stat c={c} label="أيام عمل" value={workDays.length} />
          <Stat c={c} label="الأوفر (ساعات)" value={priceVisible ? formatHM(totals.weightedHours) : "•••"} small />
          <Stat c={c} label="الصافي" value={priceVisible ? money(totals.net) : "•••"} small accent />
        </div>
        {absenceDays.length > 0 && (
          <div style={{ fontSize: 11, color: c.subtext, marginTop: 6, textAlign: "center" }}>+ {absenceDays.length} يوم غياب مسجّل (بدون خصم)</div>
        )}
        <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
          <button onClick={onAddStandalone} style={{ flex: 1, background: c.surface, color: c.text, border: `1px solid ${c.border}`, padding: "8px 0", borderRadius: 8, fontSize: 12, fontWeight: "bold", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 4 }}>
            <Icon d={paths.plus} size={13} /> إضافة خصم
          </button>
          <button onClick={onAddAbsence} style={{ flex: 1, background: c.surface, color: c.text, border: `1px solid ${c.border}`, padding: "8px 0", borderRadius: 8, fontSize: 12, fontWeight: "bold", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 4 }}>
            <Icon d={paths.calendar} size={13} /> تسجيل غياب
          </button>
        </div>
        <button onClick={onClose} style={{ width: "100%", marginTop: 8, background: c.gold, color: "#14161B", border: "none", padding: "8px 0", borderRadius: 8, fontSize: 13, fontWeight: "bold", cursor: "pointer" }}>
          إقفال الفترة
        </button>
      </div>

      {manualDeductions.length > 0 && (
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          <div style={{ fontSize: 11, color: c.subtext }}>خصومات مستقلة</div>
          {manualDeductions.map((md) => (
            <div key={md.id} style={{ background: c.surface2, border: `1px solid ${c.border}`, borderRadius: 8, padding: "6px 12px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div>
                <div style={{ fontSize: 12, fontWeight: "bold" }}>{md.label}</div>
                <div style={{ fontSize: 10, color: c.subtext }}>{md.minutes} دقيقة</div>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontSize: 13, fontFamily: "monospace", fontWeight: "bold", color: c.red }}>-{priceVisible ? money(md.value) : "•••"}</span>
                <button onClick={() => onDeleteStandalone(md.id)} style={{ background: "none", border: "none", color: c.red, cursor: "pointer" }}>
                  <Icon d={paths.x} size={14} />
                </button>
              </div>
            </div>
          ))}
        </div>
      )}

      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        <Icon d={paths.search} size={14} color={c.subtext} />
        <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="بحث بالتاريخ أو اليوم"
          style={{ ...inputStyle(c), fontSize: 12, padding: "8px 12px" }} />
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8, maxHeight: 280, overflowY: "auto" }}>
        {days.length === 0 && (
          <div style={{ fontSize: 12, textAlign: "center", padding: "24px 0", color: c.subtext }}>لسه معملتش حساب ليوم في الفترة دي</div>
        )}
        {days.map((d) =>
          d.type === "absence" ? (
            <div key={d.id} style={{ background: c.surface2, border: `1px dashed ${c.border}`, borderRadius: 8, padding: "8px 12px", display: "flex", justifyContent: "space-between", alignItems: "center", opacity: 0.85 }}>
              <div>
                <div style={{ fontSize: 12, fontWeight: "bold" }}>{formatDateArabic(d.date)}</div>
                <div style={{ fontSize: 11, color: c.subtext }}>{d.note || "إجازة بالخصم"} — للتذكير فقط، بدون خصم</div>
              </div>
              <button onClick={() => onDelete(d.id)} style={{ background: "none", border: "none", color: c.red, cursor: "pointer" }}>
                <Icon d={paths.trash} size={15} />
              </button>
            </div>
          ) : (
            <div key={d.id} style={{ background: c.surface2, border: `1px solid ${c.border}`, borderRadius: 8, padding: "8px 12px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div>
                <div style={{ fontSize: 12, fontWeight: "bold" }}>{formatDateArabic(d.date)}</div>
                <div style={{ fontSize: 11, fontFamily: "monospace", color: c.subtext }}>{d.checkIn} → {d.checkOut}</div>
                {priceVisible && d.weightedHours > 0 && (
                  <div style={{ fontSize: 10, color: c.subtext }}>ساعات مكافئة: {formatHM(d.weightedHours)}</div>
                )}
                {d.manualDeductionMinutes > 0 && (
                  <div style={{ fontSize: 10, color: c.red }}>خصم يدوي: {d.manualDeductionMinutes} دقيقة</div>
                )}
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                <span style={{ fontSize: 14, fontFamily: "monospace", fontWeight: "bold", color: d.net >= 0 ? c.gold : c.red }}>
                  {priceVisible ? money(d.net) : "•••"}
                </span>
                <button onClick={() => onDeductDay(d.id)} title="خصم دقايق يدوي" style={{ background: "none", border: "none", color: c.subtext, cursor: "pointer" }}>
                  <Icon d={paths.minusCircle} size={15} />
                </button>
                <button onClick={() => onDelete(d.id)} style={{ background: "none", border: "none", color: c.red, cursor: "pointer" }}>
                  <Icon d={paths.trash} size={15} />
                </button>
              </div>
            </div>
          )
        )}
      </div>
    </div>
  );
}

function Stat({ c, label, value, small, accent }) {
  return (
    <div>
      <div style={{ fontSize: small ? 14 : 18, fontWeight: "bold", fontFamily: "monospace", color: accent ? c.gold : c.text }}>{value}</div>
      <div style={{ fontSize: 10, color: c.subtext }}>{label}</div>
    </div>
  );
}

function ArchiveTab({ c, archive, expandedPeriod, setExpandedPeriod, onExport, pdfBusy, priceVisible, onDeletePeriod }) {
  if (archive.length === 0) {
    return (
      <div style={{ fontSize: 12, textAlign: "center", padding: "40px 0", color: c.subtext }}>
        <div style={{ marginBottom: 8, display: "flex", justifyContent: "center" }}><Icon d={paths.archive} size={22} color={c.subtext} /></div>
        لسه مفيش فترات مقفولة في الأرشيف
      </div>
    );
  }
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 8, maxHeight: 440, overflowY: "auto" }}>
      {archive.map((p) => {
        const open = expandedPeriod === p.id;
        return (
          <div key={p.id} style={{ background: c.surface2, border: `1px solid ${c.border}`, borderRadius: 8, overflow: "hidden" }}>
            <button onClick={() => setExpandedPeriod(open ? null : p.id)} style={{ width: "100%", display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 12px", background: "none", border: "none", cursor: "pointer", color: c.text }}>
              <div style={{ textAlign: "right" }}>
                <div style={{ fontSize: 12, fontWeight: "bold" }}>فترة مقفولة بتاريخ {p.closedAt}</div>
                <div style={{ fontSize: 11, color: c.subtext }}>{p.days.length} يوم</div>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontSize: 14, fontFamily: "monospace", fontWeight: "bold", color: c.gold }}>{priceVisible ? money(p.totals.net) : "•••"}</span>
                <Icon d={open ? paths.chevronUp : paths.chevronDown} size={15} />
              </div>
            </button>
            {open && (
              <div style={{ padding: "0 12px 12px", display: "flex", flexDirection: "column", gap: 6, borderTop: `1px dashed ${c.border}` }}>
                {p.days.map((d) =>
                  d.type === "absence" ? (
                    <div key={d.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: c.subtext, paddingTop: 6 }}>
                      <span>{formatDateArabic(d.date)}</span>
                      <span>{d.note || "إجازة بالخصم"}</span>
                    </div>
                  ) : (
                    <div key={d.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: c.subtext, paddingTop: 6 }}>
                      <span>{formatDateArabic(d.date)}</span>
                      <span style={{ fontFamily: "monospace" }}>{d.checkIn} → {d.checkOut}</span>
                      <span style={{ fontFamily: "monospace", color: d.net >= 0 ? c.gold : c.red }}>{priceVisible ? money(d.net) : "•••"}</span>
                    </div>
                  )
                )}
              </div>
            )}
            <div style={{ display: "flex", gap: 8, padding: "10px 12px", borderTop: `1px solid ${c.border}` }}>
              <button
                onClick={() => onExport(p, "download")}
                disabled={pdfBusy}
                style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, background: c.surface, color: c.text, border: `1px solid ${c.border}`, borderRadius: 8, padding: "8px 0", fontSize: 12, fontWeight: "bold", cursor: pdfBusy ? "default" : "pointer", opacity: pdfBusy ? 0.6 : 1 }}
              >
                <Icon d={paths.download} size={14} /> تحميل PDF
              </button>
              <button
                onClick={() => onExport(p, "share")}
                disabled={pdfBusy}
                style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, background: c.gold, color: "#14161B", border: "none", borderRadius: 8, padding: "8px 0", fontSize: 12, fontWeight: "bold", cursor: pdfBusy ? "default" : "pointer", opacity: pdfBusy ? 0.6 : 1 }}
              >
                <Icon d={paths.send} size={14} /> مشاركة واتساب
              </button>
              <button
                onClick={() => onDeletePeriod(p.id)}
                title="حذف الفترة نهائيًا"
                style={{ background: "none", border: `1px solid ${c.border}`, color: c.red, borderRadius: 8, padding: "0 12px", cursor: "pointer" }}
              >
                <Icon d={paths.trash} size={14} />
              </button>
            </div>
          </div>
        );
      })}
    </div>
  );
}

function SettingsTab({ c, settings, setSettings }) {
  const update = (key, val) => setSettings((s) => ({ ...s, [key]: val }));
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12, color: c.subtext }}>
        <Icon d={paths.info} size={13} /> القيم دي بتتحكم في كل الحسابات الجديدة
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
        <Field c={c} label="بداية الدوام">
          <input type="time" value={settings.startTime} onChange={(e) => update("startTime", e.target.value)} style={{ ...inputStyle(c), fontFamily: "monospace" }} />
        </Field>
        <Field c={c} label="نهاية الدوام">
          <input type="time" value={settings.endTime} onChange={(e) => update("endTime", e.target.value)} style={{ ...inputStyle(c), fontFamily: "monospace" }} />
        </Field>
      </div>
      <Field c={c} label="نهاية الدوام يوم الأربعاء">
        <input type="time" value={settings.wednesdayEndTime} onChange={(e) => update("wednesdayEndTime", e.target.value)} style={{ ...inputStyle(c), fontFamily: "monospace" }} />
      </Field>
      <Field c={c} label="وقت بداية الشريحة الثانية من الأوفر (×1.7)">
        <input type="time" value={settings.splitTime} onChange={(e) => update("splitTime", e.target.value)} style={{ ...inputStyle(c), fontFamily: "monospace" }} />
      </Field>
      <Field c={c} label="معامل الشريحة الأولى من الأوفر">
        <input type="number" step="0.01" value={settings.first2Multiplier} onChange={(e) => update("first2Multiplier", Number(e.target.value))} style={{ ...inputStyle(c), fontFamily: "monospace" }} />
      </Field>
      <Field c={c} label="معامل الشريحة الثانية من الأوفر">
        <input type="number" step="0.01" value={settings.restMultiplier} onChange={(e) => update("restMultiplier", Number(e.target.value))} style={{ ...inputStyle(c), fontFamily: "monospace" }} />
      </Field>
      <Field c={c} label="مضاعف خصم دقيقة التأخير">
        <input type="number" step="0.5" value={settings.lateMultiplier} onChange={(e) => update("lateMultiplier", Number(e.target.value))} style={{ ...inputStyle(c), fontFamily: "monospace" }} />
      </Field>
      <Field c={c} label="PIN إظهار السعر (اختياري)">
        <input
          type="password" inputMode="numeric" value={settings.pricePin}
          onChange={(e) => update("pricePin", e.target.value)}
          placeholder="سيبه فاضي = بدون حماية"
          style={{ ...inputStyle(c), fontFamily: "monospace", letterSpacing: 4 }}
        />
      </Field>
      <div style={{ background: c.surface2, border: `1px solid ${c.border}`, borderRadius: 8, padding: 12, display: "flex", alignItems: "center", gap: 8, fontSize: 12 }}>
        <Icon d={paths.lock} size={14} color={c.subtext} />
        <span style={{ color: c.subtext }}>لو حطيت PIN، هيتطلب منك كل مرة تحب تشوف فيها السعر أو الأرقام. الإخفاء دايمًا من غير باسورد.</span>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
